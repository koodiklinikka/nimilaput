<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Koodiklinikka nimilappu generaattori</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js"></script>
    <script src="magic.js"></script>
    <script src="emoji.js"></script>
  </head>
  <body onload="handleBoot()">
    <div class="laput">
      <button class="lisalappu" onclick="handleClickAdd()">+</button>
      <div class="hakulappu">
        <input
          type="search"
          oninput="handleSearch(event)"
          placeholder="Hae nimellä..."
        />
        <div id="hakutulokset"></div>
      </div>
    </div>
    <template id="lappu-template">
      <div class="lappu">
        <div class="card-buttons">
          <button class="delete-btn" onclick="handleYeet(event)">
            &times; Poista
          </button>
          <button onclick="handleRandomEmoji(event, 'noto')">🎲 Emoji</button>
          <button onclick="handleRandomEmoji(event, 'kitchen')">
            🎲 Kitchen
          </button>
          <button onclick="handleRandomEmoji(event, 'kk')">🎲 KK</button>
          <button class="clear-image-btn" onclick="handleClearImage(event)">
            Tyhjennä kuva
          </button>
        </div>
        <div style="text-align: center">
          <figure class="empty">
            <input type="file" onchange="handleUpload(event)" />
            <img
              alt="Matti Meikäläinen"
              onDrop="handleDrop(event)"
              onDragOver="handleDragOver(event)"
            />
          </figure>
          <h1 contenteditable class="nimi">Matti Meikäläinen</h1>
          <h2 class="username" contenteditable>@mattimeikalainen</h2>
        </div>
      </div>
    </template>
  </body>
</html>
